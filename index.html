<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хусенов Хикматжон</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --ink:#1b1f1c;
    --paper:#faf6ef;
    --card:#ffffff;
    --line:rgba(27,31,28,0.08);
    --gold:#b5893a;
    --deep:#26312a;
    --deep-2:#1b241f;
    --muted:#79776e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% -10%, #2c3630 0%, #14181a 55%, #101312 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:40px 16px;
  }
  .sheet{
    width:100%;
    max-width:380px;
    background:var(--paper);
    border-radius:26px;
    padding:0 0 30px;
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
  }
  .sheet-shape{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
  }
  .sheet-shape.ss1{
    width:280px; height:280px;
    right:-110px; bottom:-100px;
    background:radial-gradient(circle, rgba(181,137,58,0.10) 0%, transparent 70%);
  }
  .sheet-shape.ss2{
    width:220px; height:220px;
    left:-90px; top:180px;
    background:radial-gradient(circle, rgba(38,49,42,0.06) 0%, transparent 70%);
  }
  .header-band, .footer{
    position:relative;
    z-index:1;
  }
  .header-band{
    margin:16px;
    border-radius:20px;
    background:linear-gradient(160deg, var(--deep) 0%, var(--deep-2) 100%);
    position:relative;
    overflow:hidden;
    padding:28px 24px 26px;
  }
  .header-band::after{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
    background-size:14px 14px;
    opacity:0.5;
  }
  .header-band::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    right:-60px;
    top:-70px;
    background:radial-gradient(circle, rgba(197,155,80,0.35) 0%, transparent 70%);
  }
  .header-band > *{
    position:relative;
    z-index:1;
  }
  .avatar-wrap{
    position:relative;
    width:108px;
    height:108px;
    margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(150deg, var(--gold) 0%, #8f6a2c 100%);
    border:4px solid var(--paper);
    box-shadow:0 10px 22px -6px rgba(181,137,58,0.45), 0 6px 18px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar-initials{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:34px;
    color:var(--paper);
    letter-spacing:1px;
    user-select:none;
  }
  .avatar-badge{
    position:absolute;
    right:-2px;
    bottom:-2px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:var(--deep);
    border:3px solid var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
  }
  .avatar-badge svg{ width:13px; height:13px; }
  .name{
    text-align:center;
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    font-size:23px;
    color:var(--paper);
    margin:0 0 6px;
    letter-spacing:0.1px;
  }
  .rule{
    width:34px;
    height:2px;
    background:var(--gold);
    margin:0 auto 10px;
    border-radius:2px;
  }
  .role{
    text-align:center;
    font-size:13px;
    color:rgba(250,246,239,0.62);
    margin:0;
    letter-spacing:0.4px;
    text-transform:uppercase;
    font-weight:500;
  }
  .grid{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:4px 24px 0;
  }
  .tile{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:13px 14px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(27,31,28,0.03);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .tile:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 22px -8px rgba(27,31,28,0.18);
    border-color:rgba(27,31,28,0.14);
  }
  .tile:active{ transform:translateY(0) scale(0.98); }
  .tile-icon{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .tile-icon svg{ width:21px; height:21px; }
  .tile-icon.i-tg{ background:#e8f2fb; color:#2b8fd6; }
  .tile-icon.i-ig{ background:linear-gradient(135deg,#fde3ea,#fce7d6); color:#c8447a; }
  .tile-icon.i-tel{ background:#e7f4ea; color:#2f9450; }
  .tile-icon.i-loc{ background:#fdece6; color:#d1622f; }
  .tile-text{ flex:1; min-width:0; }
  .tile-label{
    font-size:15px;
    color:var(--ink);
    font-weight:600;
    margin:0;
    letter-spacing:0.1px;
  }
  .tile-sub{
    font-size:12px;
    color:var(--muted);
    margin:1px 0 0;
    letter-spacing:0.2px;
  }
  .tile-arrow{
    color:var(--muted);
    opacity:0.6;
    flex-shrink:0;
  }
  @keyframes riseIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .header-band{ animation:riseIn .5s ease both; }
  .avatar-wrap{ animation:riseIn .5s ease .08s both; }
  .name{ animation:riseIn .5s ease .14s both; }
  .rule{ animation:riseIn .5s ease .18s both; }
  .role{ animation:riseIn .5s ease .2s both; }
  .grid .tile:nth-child(1){ animation:riseIn .5s ease .26s both; }
  .grid .tile:nth-child(2){ animation:riseIn .5s ease .32s both; }
  .grid .tile:nth-child(3){ animation:riseIn .5s ease .38s both; }
  .grid .tile:nth-child(4){ animation:riseIn .5s ease .44s both; }
  .footer{ animation:riseIn .5s ease .5s both; }
  .footer{
    text-align:center;
    margin-top:6px;
    padding:0 24px;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.3px;
  }
</style>
</head>
<body>
